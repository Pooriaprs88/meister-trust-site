<!DOCTYPE html>
<html lang="en-CA">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Page Not Found - Meister Trust Services</title>
        <meta name="robots" content="noindex" />
        <link rel="icon" type="image/png" href="assets/favicon.png" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" crossorigin="anonymous" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto+Slab:wght@100;300;400;700&display=swap" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
        <style>
            :root { --bs-primary: #0B6290; --bs-primary-rgb: 11, 98, 144; }
            body { font-family: "Roboto Slab", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8f9fa; display: flex; flex-direction: column; min-height: 100vh; }
            .error-section { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 3rem 1rem; }
            .error-code { font-family: "Montserrat", sans-serif; font-size: 8rem; font-weight: 700; color: #0B6290; line-height: 1; margin-bottom: 1rem; }
            .error-title { font-family: "Montserrat", sans-serif; font-size: 1.75rem; font-weight: 700; color: #212529; margin-bottom: 1rem; }
            .error-message { color: #6c757d; font-size: 1.1rem; max-width: 500px; margin: 0 auto 2rem; line-height: 1.7; }
            .btn-primary { --bs-btn-bg: #0B6290; --bs-btn-border-color: #0B6290; --bs-btn-hover-bg: #094f74; --bs-btn-hover-border-color: #08486b; }
            .btn-xl { padding: 1rem 2rem; font-family: "Montserrat", sans-serif; font-size: 1rem; font-weight: 700; text-transform: uppercase; }
            .footer { background-color: #212529; color: #adb5bd; text-align: center; padding: 1.5rem; font-size: 0.85rem; }
            .footer a { color: #adb5bd; }
            @media (max-width: 576px) { .error-code { font-size: 5rem; } .error-title { font-size: 1.25rem; } }
        </style>
    </head>
    <body>
        <div class="error-section">
            <div>
                <a href="/">
                    <img src="assets/logo horizontal black@2x.png" alt="Meister Trust Services" style="height: 2.5rem; margin-bottom: 2rem;" />
                </a>
                <div class="error-code">404</div>
                <h1 class="error-title">Page Not Found</h1>
                <p class="error-message">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
                <a class="btn btn-primary btn-xl" href="/">Back to Homepage</a>
            </div>
        </div>
        <footer class="footer">
            Copyright &copy; Meister Trust Services <script>document.write(new Date().getFullYear())</script>
            &nbsp;|&nbsp;
            <a href="mailto:MeisterTrustServices@outlook.com">MeisterTrustServices@outlook.com</a>
        </footer>
    </body>
</html>
